<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{styleUri}}" />
  <title>Serial Terminal</title>
  <style>
    .log {
      flex: 1 1 auto;
      min-height: 120px;
      overflow-y: auto;
      padding: 6px 10px;
      font-family: var(--vscode-editor-font-family, Consolas, monospace);
      font-size: var(--vscode-editor-font-size, 12px);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--vscode-editor-background);
    }
    .log .ts { opacity: 0.45; margin-right: 6px; }
    .log .tag { display: inline-block; width: 26px; opacity: 0.8; }
    .log .rx { color: var(--vscode-charts-blue, #4fc3f7); }
    .log .tx { color: var(--vscode-charts-green, #8bc34a); }
    .log .info { color: var(--vscode-descriptionForeground, #999); }
    .log .err { color: var(--vscode-errorForeground, #f85149); }

    .send-row { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--stp-border); }
    .send-row input { flex: 1 1 auto; }

    .commands {
      border-top: 1px solid var(--stp-border);
      max-height: 46%;
      display: flex;
      flex-direction: column;
    }
    .commands-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: var(--vscode-editorWidget-background, transparent);
      border-bottom: 1px solid var(--stp-border);
    }
    .commands-body { overflow: auto; }
    td .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; }
    td.actions { white-space: nowrap; }
    .chip {
      display: inline-block;
      padding: 0 5px;
      border-radius: 8px;
      font-size: 10px;
      border: 1px solid var(--stp-border);
      opacity: 0.85;
    }
    .chip.run { border-color: #3fb950; color: #3fb950; }

    dialog#editor {
      width: min(720px, 92vw);
      border: 1px solid var(--stp-border);
      border-radius: 6px;
      background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
      color: var(--vscode-foreground);
      padding: 0;
    }
    dialog#editor::backdrop { background: rgba(0,0,0,0.45); }
    .dlg-head { padding: 10px 14px; border-bottom: 1px solid var(--stp-border); font-weight: 600; }
    .dlg-body { padding: 12px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .dlg-body label.field { flex-direction: column; align-items: stretch; gap: 3px; }
    .dlg-body label.field > span { opacity: 0.75; }
    .dlg-body input, .dlg-body select, .dlg-body textarea { width: 100%; }
    .span2 { grid-column: span 2; }
    .span4 { grid-column: span 4; }
    .dlg-foot { padding: 10px 14px; border-top: 1px solid var(--stp-border); display: flex; gap: 8px; align-items: center; }
    .channels { display: flex; flex-wrap: wrap; gap: 8px; }
    .channels label { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; }
    .test-out { font-size: 11px; font-family: var(--vscode-editor-font-family, monospace); }
    .test-out.ok { color: #3fb950; }
    .test-out.bad { color: #f85149; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="status-dot" id="dot"></span>
    <label class="field">port
      <select id="port" style="min-width:170px"></select>
    </label>
    <button class="icon" id="refreshPorts" title="Rescan ports">⟳</button>
    <label class="field">baud
      <input id="baud" type="number" list="bauds" value="115200" style="width:82px" />
      <datalist id="bauds">
        <option value="9600"></option><option value="19200"></option><option value="38400"></option>
        <option value="57600"></option><option value="115200"></option><option value="230400"></option>
        <option value="460800"></option><option value="921600"></option>
      </datalist>
    </label>
    <label class="field">data
      <select id="dataBits"><option>8</option><option>7</option><option>6</option><option>5</option></select>
    </label>
    <label class="field">parity
      <select id="parity">
        <option value="none">none</option><option value="even">even</option><option value="odd">odd</option>
        <option value="mark">mark</option><option value="space">space</option>
      </select>
    </label>
    <label class="field">stop
      <select id="stopBits"><option>1</option><option>1.5</option><option>2</option></select>
    </label>
    <label class="field"><input type="checkbox" id="rtscts" /> rts/cts</label>
    <button id="connect">Connect</button>
    <div class="sep"></div>
    <button class="secondary" id="openGraph">Graph</button>
    <button class="secondary" id="openResponse">Response</button>
  </div>

  <div class="toolbar">
    <label class="field">eol
      <select id="lineEnding">
        <option value="\r\n">CRLF</option><option value="\n">LF</option>
        <option value="\r">CR</option><option value="none">none</option>
      </select>
    </label>
    <label class="field"><input type="checkbox" id="timestamps" checked /> timestamps</label>
    <label class="field"><input type="checkbox" id="autoscroll" checked /> autoscroll</label>
    <label class="field"><input type="checkbox" id="hexView" /> hex view</label>
    <label class="field">filter <input id="filter" placeholder="substring" style="width:120px" /></label>
    <button class="secondary" id="clearLog">Clear</button>
    <div class="sep"></div>
    <button class="secondary" id="logToggle" title="Start/stop writing received data to a file">⏺ Log to file</button>
    <button class="icon" id="logChoose" title="Choose log file…">📁</button>
    <button class="icon" id="logFlush" title="Flush the buffer to disk now">⤓</button>
    <button class="icon" id="logOpen" title="Open the current log file">↗</button>
    <span class="muted mono" id="logStatus" style="font-size:11px"></span>
    <div class="spacer"></div>
    <button id="startAll">▶ Start all</button>
    <button class="secondary" id="stopAll">■ Stop all</button>
  </div>

  <div class="banner hidden" id="banner"></div>

  <div class="content">
    <div class="log mono" id="log"></div>

    <div class="send-row">
      <input id="manual" class="mono" placeholder="Type a command and press Enter (↑/↓ for history)" />
      <button id="send">Send</button>
    </div>

    <div class="commands">
      <div class="commands-head">
        <strong>Scheduled commands</strong>
        <span class="muted" id="cmdCount"></span>
        <div class="spacer"></div>
        <button id="addCommand">+ Add command</button>
        <button class="secondary" id="importCommands">Import</button>
        <button class="secondary" id="exportCommands">Export</button>
      </div>
      <div class="commands-body">
        <table>
          <thead>
            <tr>
              <th style="width:26px"></th>
              <th>Name</th>
              <th>Payload</th>
              <th style="width:90px">Repeat</th>
              <th style="width:120px">Channels</th>
              <th style="width:60px">Plot</th>
              <th style="width:60px">Win</th>
              <th style="width:70px">State</th>
              <th style="width:190px">Actions</th>
            </tr>
          </thead>
          <tbody id="cmdRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <dialog id="editor">
    <form method="dialog">
      <div class="dlg-head" id="dlgTitle">Add command</div>
      <div class="dlg-body">
        <label class="field span2"><span>Name (must match the echoed command)</span><input id="fName" required /></label>
        <label class="field span2"><span>Payload sent on the wire</span><input id="fPayload" class="mono" /></label>

        <label class="field"><span>Encoding</span>
          <select id="fEncoding"><option value="ascii">ascii</option><option value="hex">hex</option></select>
        </label>
        <label class="field"><span>Line ending</span>
          <select id="fEol">
            <option value="\r\n">CRLF</option><option value="\n">LF</option>
            <option value="\r">CR</option><option value="none">none</option>
          </select>
        </label>
        <label class="field"><span>Repeat every (ms, 0 = one-shot)</span><input id="fRepeat" type="number" min="0" step="10" value="1000" /></label>
        <label class="field"><span>Colour</span><input id="fColor" type="color" value="#4FC3F7" /></label>

        <label class="field span4"><span>Response pattern</span>
          <div style="display:flex; gap:8px;">
            <select id="fMode" style="width:110px"><option value="template">template</option><option value="regex">regex</option></select>
            <input id="fPattern" class="mono" style="flex:1 1 auto"
                   value="or &lt;COMMAND&gt; ch1:&lt;data&gt; ch2:&lt;data&gt; ch3:&lt;data&gt; ch4:&lt;data&gt;" />
            <input id="fFlags" class="mono" style="width:60px" value="i" title="Regex flags" />
          </div>
        </label>
        <div class="span4 muted" style="font-size:11px; margin-top:-4px">
          Placeholders: <code>&lt;command&gt;</code> echoed name · <code>&lt;data&gt;</code> next free channel ·
          <code>&lt;ch3&gt;</code> explicit channel · <code>&lt;hex&gt;</code> hex value · <code>&lt;any&gt;</code> filler.
        </div>

        <label class="field span4"><span>Channels to extract / plot</span>
          <div class="channels" id="fChannels"></div>
        </label>

        <label class="field span2"><span>Plot to graph window</span>
          <div style="display:flex; gap:8px; align-items:center">
            <input type="checkbox" id="fPlot" checked />
            <select id="fWindow" style="flex:1 1 auto"></select>
          </div>
        </label>
        <label class="field span2"><span>Auto-start with “Start all”</span>
          <div><input type="checkbox" id="fEnabled" checked /></div>
        </label>

        <label class="field span4"><span>Test against a sample response line</span>
          <div style="display:flex; gap:8px">
            <input id="fSample" class="mono" style="flex:1 1 auto" placeholder="or READ ch1:1.0 ch2:2.0 ch3:3.0 ch4:4.0" />
            <button type="button" class="secondary" id="fTest">Test</button>
          </div>
        </label>
        <div class="span4 test-out" id="fTestOut"></div>
      </div>
      <div class="dlg-foot">
        <button value="save" id="dlgSave">Save</button>
        <button value="cancel" class="secondary" id="dlgCancel">Cancel</button>
        <div class="spacer"></div>
        <span class="muted" id="dlgHint"></span>
      </div>
    </form>
  </dialog>

  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
