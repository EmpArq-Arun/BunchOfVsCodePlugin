<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Complexity Cosmos — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0:#070611; --bg-1:#0c0a1d; --bg-2:#100c26;
    --ink:#eceaf6; --muted:#9b9ec4; --faint:#6a6d92;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
    --card:rgba(255,255,255,.035);
    --warn:#ffb454; --sev:#ff6b6b; --ok:#6ec3ff; --plasma:#b18cff;
    --display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:var(--display); color:var(--ink); padding:28px 22px 60px;
    background:
      radial-gradient(1200px 600px at 12% -8%, #1a1340 0%, transparent 55%),
      radial-gradient(900px 500px at 95% 8%, #10243f 0%, transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0) 70%);
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  /* faint starfield */
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 18%, #cdd6ff, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 85% 55%, #b9c6ff, transparent),
      radial-gradient(1px 1px at 55% 42%, #fff, transparent),
      radial-gradient(1px 1px at 12% 80%, #fff, transparent),
      radial-gradient(1px 1px at 92% 88%, #d9e2ff, transparent);
    background-repeat:no-repeat;
  }
  .wrap { max-width:880px; margin:0 auto; position:relative; }

  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .title { font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.1; }
  .title small { display:block; font-size:12.5px; font-weight:400; color:var(--muted); letter-spacing:0; margin-top:5px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ctl { display:flex; flex-direction:column; gap:4px; }
  .ctl label { font-size:10.5px; text-transform:uppercase; letter-spacing:.13em; color:var(--faint); padding-left:2px; }
  select, input[type=number] {
    font-family:var(--mono); font-size:13px; color:var(--ink);
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; min-width:140px; outline:none;
  }
  input[type=number] { min-width:84px; }
  select:focus, input:focus { border-color:var(--plasma); box-shadow:0 0 0 3px rgba(177,140,255,.18); }

  /* ---- legend / scale ---- */
  .scale { margin:22px 0 4px; padding:14px 8px 10px;
    background:var(--card); border:1px solid var(--line-2); border-radius:14px; }
  .scale-row { display:flex; align-items:flex-end; justify-content:space-between; gap:4px; }
  .scale-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; min-width:0; }
  .scale-step .blabel { font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.01em; }
  .scale-step .brange { font-family:var(--mono); font-size:10px; color:var(--faint); }
  .scale-cap { display:flex; justify-content:space-between; margin-top:6px; padding:0 4px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); }

  /* ---- cards ---- */
  .list { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .card {
    display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:16px;
    padding:14px 18px; background:var(--card); border:1px solid var(--line-2);
    border-radius:14px; cursor:pointer; transition:border-color .18s, transform .18s, background .18s;
  }
  .card:hover { border-color:var(--line); background:rgba(255,255,255,.05); transform:translateY(-1px); }
  .card.flagged { border-color:color-mix(in srgb, var(--warn) 55%, transparent); }
  .card.severe  { border-color:color-mix(in srgb, var(--sev) 60%, transparent);
                  box-shadow:0 0 24px -8px rgba(255,107,107,.5); }

  .bodywrap { display:grid; place-items:center; height:84px; }
  .meta { min-width:0; }
  .fname { font-family:var(--mono); font-size:14.5px; font-weight:600; letter-spacing:-.01em;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sig { font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:2px;
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tierline { display:flex; align-items:center; gap:8px; margin-top:7px; }
  .pill { font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:2px 8px; border-radius:999px;
          background:rgba(255,255,255,.06); color:var(--muted); border:1px solid var(--line-2); }
  .flag { font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:999px;
          display:none; align-items:center; gap:5px; }
  .flagged .flag { display:inline-flex; color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent);
                   border:1px solid color-mix(in srgb,var(--warn) 40%,transparent); }
  .severe .flag { color:var(--sev); background:color-mix(in srgb,var(--sev) 14%,transparent);
                  border:1px solid color-mix(in srgb,var(--sev) 45%,transparent); }

  .right { display:flex; align-items:center; gap:18px; }
  .val { text-align:right; }
  .val .num { font-family:var(--mono); font-size:26px; font-weight:600; line-height:1; }
  .val .unit { font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--faint); margin-top:5px; }
  .spark { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .delta { font-family:var(--mono); font-size:11px; display:flex; align-items:center; gap:4px; }
  .delta.up { color:var(--warn); } .delta.down { color:var(--ok); } .delta.flat { color:var(--faint); }

  .foot { margin-top:22px; font-size:11.5px; color:var(--faint); text-align:center; line-height:1.6; }
  .foot code { font-family:var(--mono); color:var(--muted); }

  @media (max-width:640px){
    .card { grid-template-columns:72px 1fr; }
    .right { grid-column:1 / -1; justify-content:space-between; padding-top:4px;
             border-top:1px solid var(--line-2); margin-top:2px; }
    .bodywrap { height:72px; }
    .scale-step .brange { display:none; }
  }

  /* ============================================================= *
   *  CELESTIAL BODIES — the signature element.                    *
   *  Each tier is denser / more luminous than the last, ending    *
   *  in a black hole whose accretion disk rotates.                *
   * ============================================================= */
  .body { position:relative; display:grid; place-items:center; }
  .body .core { border-radius:50%; position:relative; }

  /* t0 — asteroid */
  .t0 .core { width:26px; height:26px; background:radial-gradient(circle at 34% 30%, #9aa0ab, #565a63 68%, #2d3036);
    border-radius:47% 53% 56% 44% / 52% 46% 54% 48%;
    box-shadow:inset -4px -4px 7px rgba(0,0,0,.6), inset 3px 3px 5px rgba(255,255,255,.12); }

  /* t1 — moon */
  .t1 .core { width:34px; height:34px; background:radial-gradient(circle at 34% 30%, #dfe2ea, #9aa0ad 62%, #5e6573);
    box-shadow:inset -6px -6px 12px rgba(0,0,0,.42); }
  .t1 .core::before, .t1 .core::after { content:""; position:absolute; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, rgba(0,0,0,.22), transparent 70%); }
  .t1 .core::before { width:9px; height:9px; top:7px; left:9px; }
  .t1 .core::after  { width:6px; height:6px; bottom:8px; right:8px; }

  /* t2 — terrestrial planet */
  .t2 .core { width:42px; height:42px; overflow:hidden;
    background:
      radial-gradient(circle at 70% 78%, #3aa66b 0 18%, transparent 19%),
      radial-gradient(circle at 30% 40%, #2f9e7a 0 14%, transparent 15%),
      radial-gradient(circle at 34% 30%, #7ec8ff, #2f7ecb 65%, #11447f);
    box-shadow:inset -6px -6px 14px rgba(0,0,0,.45), 0 0 12px 1px rgba(120,200,255,.45); }
  .t2 .core::after { content:""; position:absolute; inset:-3px; border-radius:50%;
    box-shadow:inset 0 0 8px 2px rgba(150,210,255,.4); }

  /* t3 — gas giant */
  .t3 .core { width:52px; height:52px; overflow:hidden;
    background:repeating-linear-gradient(8deg, #f0c27b 0 5px, #d99a52 5px 9px, #c97f3b 9px 13px, #e8b873 13px 18px);
    box-shadow:inset -8px -6px 16px rgba(0,0,0,.5), 0 0 16px 1px rgba(230,170,90,.4); }
  .t3 .core::before { content:""; position:absolute; inset:0; border-radius:50%;
    background:repeating-linear-gradient(8deg, transparent 0 9px, rgba(255,255,255,.10) 9px 11px);
    animation:drift 9s linear infinite; }
  @keyframes drift { to { transform:translateX(-12px); } }

  /* t4 — star */
  .t4 .core { width:50px; height:50px;
    background:radial-gradient(circle at 50% 50%, #fff 0%, #ffe9a8 28%, #ffb347 64%, #ff7b00 100%);
    box-shadow:0 0 26px 6px rgba(255,180,70,.6); animation:starpulse 3.2s ease-in-out infinite; }
  @keyframes starpulse { 0%,100%{ box-shadow:0 0 22px 5px rgba(255,180,70,.5);} 50%{ box-shadow:0 0 34px 10px rgba(255,200,90,.75);} }

  /* t5 — red giant */
  .t5 .core { width:66px; height:66px;
    background:radial-gradient(circle at 48% 46%, #ffe0b8 0%, #ff7a59 38%, #d1330f 78%, #6e1207 100%);
    box-shadow:0 0 38px 12px rgba(255,90,40,.4); animation:redpulse 4.4s ease-in-out infinite; }
  @keyframes redpulse { 0%,100%{ transform:scale(1); filter:saturate(1);} 50%{ transform:scale(1.045); filter:saturate(1.25);} }

  /* t6 — neutron star */
  .t6 .core { width:24px; height:24px;
    background:radial-gradient(circle at 50% 50%, #ffffff 0%, #d4ecff 42%, #5a93ff 88%);
    box-shadow:0 0 18px 7px rgba(120,180,255,.9); animation:neutron 1.1s ease-in-out infinite; }
  .t6 .beams { position:absolute; width:96px; height:3px;
    background:linear-gradient(90deg, transparent, rgba(150,200,255,.85), transparent);
    filter:blur(1px); animation:spin 7s linear infinite; }
  .t6 .beams.b2 { transform:rotate(90deg); }
  @keyframes neutron { 0%,100%{ box-shadow:0 0 14px 5px rgba(120,180,255,.75);} 50%{ box-shadow:0 0 24px 10px rgba(170,210,255,1);} }

  /* t7 — black hole */
  .t7 { width:74px; height:74px; }
  .t7 .disk { position:absolute; width:74px; height:74px; border-radius:50%;
    background:conic-gradient(from 0deg, #ff7b00, #ffd36e, #ffffff, #9be0ff, #2a6cff, #170033, #ff7b00);
    filter:blur(2px); animation:spin 6s linear infinite;
    -webkit-mask:radial-gradient(circle, transparent 30%, #000 38%, #000 100%);
            mask:radial-gradient(circle, transparent 30%, #000 38%, #000 100%); }
  .t7 .horizon { position:absolute; width:34px; height:34px; border-radius:50%; background:#000;
    box-shadow:0 0 0 2px rgba(255,225,160,.9), 0 0 16px 4px rgba(255,210,140,.55), inset 0 0 8px #000; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){ * { animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">Complexity Cosmos
      <small>Functions in <code style="font-family:var(--mono)">motor_control.c</code> — gravity scales with complexity</small>
    </div>
    <div class="controls">
      <div class="ctl">
        <label for="metric">Metric</label>
        <select id="metric"></select>
      </div>
      <div class="ctl">
        <label for="thr">Flag above</label>
        <input id="thr" type="number" min="1" />
      </div>
    </div>
  </header>

  <section class="scale" id="scale"></section>

  <div class="list" id="list"></div>

  <p class="foot">
    Click a body to jump to the function in the editor. Sparklines show each metric tracked over
    time from <code>.vscode/complexity-history.json</code>; the dashed line is your threshold.
  </p>
</div>

<script>
const FUNCS = [
  { name:"clamp",                  sig:"static int (int, int, int)",        ccn:2,  nloc:4,   tokens:28,   params:3, length:5 },
  { name:"crc16_update",           sig:"uint16_t (uint16_t, uint8_t)",      ccn:4,  nloc:14,  tokens:90,   params:2, length:18 },
  { name:"adc_sample_convert",     sig:"int32_t (adc_ch_t, uint16_t)",      ccn:6,  nloc:30,  tokens:150,  params:2, length:36 },
  { name:"dcdc_pid_update",        sig:"void (pid_t*, float, float, float)",ccn:8,  nloc:38,  tokens:240,  params:4, length:44 },
  { name:"ipc_spi_isr",            sig:"void (void)",                       ccn:13, nloc:55,  tokens:360,  params:1, length:60 },
  { name:"parse_config_frame",     sig:"int (const uint8_t*, size_t, cfg_t*)",ccn:15,nloc:64, tokens:410, params:3, length:70 },
  { name:"motor_commutation_step", sig:"void (motor_t*, uint8_t, q15_t)",   ccn:19, nloc:80,  tokens:520,  params:3, length:88 },
  { name:"fault_handler_dispatch", sig:"int (fault_t, ctx_t*)",            ccn:27, nloc:110, tokens:700,  params:2, length:120 },
  { name:"state_machine_run",      sig:"int (ctx_t*)",                     ccn:41, nloc:180, tokens:1100, params:1, length:195 },
];

const METRICS = {
  ccn:    { label:"Cyclomatic",   unit:"CCN",    def:10,  bands:[3,5,7,11,16,24,40] },
  nloc:   { label:"Lines (NLOC)", unit:"NLOC",   def:60,  bands:[8,18,30,50,80,120,180] },
  tokens: { label:"Tokens",       unit:"TOK",    def:400, bands:[60,120,220,360,560,820,1100] },
  params: { label:"Parameters",   unit:"PARAM",  def:5,   bands:[1,2,3,4,5,6,7] },
  length: { label:"Span (lines)", unit:"LINES",  def:80,  bands:[10,20,35,55,85,130,200] },
};

const TIERS = [
  { cls:"t0", name:"Asteroid",    risk:"Trivial" },
  { cls:"t1", name:"Moon",        risk:"Simple" },
  { cls:"t2", name:"Planet",      risk:"Modest" },
  { cls:"t3", name:"Gas giant",   risk:"Notable" },
  { cls:"t4", name:"Star",        risk:"Heavy" },
  { cls:"t5", name:"Red giant",   risk:"Severe" },
  { cls:"t6", name:"Neutron star",risk:"Critical" },
  { cls:"t7", name:"Black hole",  risk:"Untestable" },
];

function tierOf(v, bands){ let t=0; for(const b of bands){ if(v>b) t++; else break; } return t; }

function bodyHTML(cls){
  if(cls==="t6") return `<span class="body ${cls}"><span class="beams"></span><span class="beams b2"></span><span class="core"></span></span>`;
  if(cls==="t7") return `<span class="body ${cls}"><span class="disk"></span><span class="horizon"></span></span>`;
  return `<span class="body ${cls}"><span class="core"></span></span>`;
}

/* deterministic, slightly-rising history so trends read as "complexity creep" */
function rng(seed){ let s=seed>>>0||1; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function history(value, seed, n=12){
  const r=rng(seed); const pts=[]; let v=Math.max(1,value*(0.55+r()*0.18));
  for(let i=0;i<n-1;i++){ v += (value-v)*(0.10+r()*0.10) + (r()-0.42)*value*0.05; pts.push(Math.max(.5,v)); }
  pts.push(value); return pts.map(x=>Math.round(x*10)/10);
}

function sparkline(series, threshold){
  const w=132, h=34, pad=4;
  const all=series.concat([threshold]);
  let lo=Math.min(...all), hi=Math.max(...all); if(hi-lo<1e-6) hi=lo+1;
  const x=i=> pad + i*(w-2*pad)/(series.length-1);
  const y=v=> h-pad - (v-lo)*(h-2*pad)/(hi-lo);
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;
  const last=series[series.length-1];
  const col = last>threshold ? "var(--sev)" : (series[series.length-1]>series[0] ? "var(--warn)" : "var(--ok)");
  const ty=y(threshold).toFixed(1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polygon points="${area}" fill="${col}" opacity="0.10"/>
    <line x1="0" y1="${ty}" x2="${w}" y2="${ty}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(series.length-1)}" cy="${y(last)}" r="2.4" fill="${col}"/>
  </svg>`;
}

function render(){
  const m = sel.value, M = METRICS[m];
  const thr = Number(thrInput.value)||M.def;

  // scale legend
  scaleEl.innerHTML = `<div class="scale-row">` + TIERS.map((t,i)=>{
    const lo = i===0 ? 0 : M.bands[i-1]+1;
    const hi = i===TIERS.length-1 ? "∞" : M.bands[i];
    const range = i===TIERS.length-1 ? `${lo}+` : (lo===hi? `${lo}` : `${lo}–${hi}`);
    return `<div class="scale-step">${bodyHTML(t.cls)}
      <div class="blabel">${t.name}</div><div class="brange">${range}</div></div>`;
  }).join("") + `</div>
    <div class="scale-cap"><span>← easy to reason about</span><span>understanding can't escape →</span></div>`;

  // cards, sorted by current metric descending
  const rows = FUNCS.map(f=>({ f, v:f[m], tier:tierOf(f[m], M.bands) }))
                    .sort((a,b)=> b.v - a.v);

  listEl.innerHTML = rows.map(({f,v,tier})=>{
    const t=TIERS[tier];
    const flagged = v>thr;
    const severe = v>thr*2 || tier>=6;
    const series = history(v, hash(f.name+m));
    const d = +(series[series.length-1]-series[0]).toFixed(1);
    const dCls = Math.abs(d)<0.5?"flat":(d>0?"up":"down");
    const dArrow = dCls==="up"?"▲":dCls==="down"?"▼":"—";
    return `<div class="card ${flagged?'flagged':''} ${severe?'severe':''}" data-name="${f.name}">
      <div class="bodywrap">${bodyHTML(t.cls)}</div>
      <div class="meta">
        <div class="fname">${f.name}</div>
        <div class="sig">${f.sig}</div>
        <div class="tierline">
          <span class="pill">${t.name} · ${t.risk}</span>
          <span class="flag">⚠ over threshold</span>
        </div>
      </div>
      <div class="right">
        <div class="spark">${sparkline(series, thr)}
          <span class="delta ${dCls}">${dArrow} ${d>0?'+':''}${d}</span></div>
        <div class="val"><div class="num">${v}</div><div class="unit">${M.unit}</div></div>
      </div>
    </div>`;
  }).join("");
}

const sel=document.getElementById("metric");
const thrInput=document.getElementById("thr");
const scaleEl=document.getElementById("scale");
const listEl=document.getElementById("list");

Object.entries(METRICS).forEach(([k,v])=>{
  const o=document.createElement("option"); o.value=k; o.textContent=v.label; sel.appendChild(o);
});
sel.value="ccn"; thrInput.value=METRICS.ccn.def;
sel.addEventListener("change", ()=>{ thrInput.value=METRICS[sel.value].def; render(); });
thrInput.addEventListener("input", render);
render();
</script>
</body>
</html>
